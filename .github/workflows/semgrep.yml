name: Semgrep

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v6

      - name: Run Semgrep
        run: >
          semgrep scan
          --config p/javascript
          --config p/typescript
          --config p/secrets
          --error
          --verbose
